name: "Database Tables Report"
description: "List all tables in the database with metadata (row counts, size, columns)"
version: "1.0"
format: "weasyprint"
timeout: 120

parameters:
  - name: schema_name
    type: string
    required: false
    description: "Filter by specific schema (default: public)"
    default: "public"
    enum_query: "schema_names_enum.sql"
